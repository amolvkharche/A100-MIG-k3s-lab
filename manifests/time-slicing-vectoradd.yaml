apiVersion: apps/v1
kind: Deployment
metadata:
  name: mig-timeslice-test
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mig-timeslice-test
  template:
    metadata:
      labels:
        app: mig-timeslice-test
    spec:
      containers:
        - name: cuda-test
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                /cuda-samples/vectorAdd || exit 1
                sleep 10
              done
          resources:
            limits:
              nvidia.com/mig-3g.20gb.shared: 1
